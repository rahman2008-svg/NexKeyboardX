name: Bug Report
description: Report an unexpected error, crash, or incorrect behavior in NexVora Keyboard.
labels: ["bug"]
title: "Bug: "

body:
  - type: markdown
    attributes:
      value: |
        # 🧠 Thank you for reporting a bug in NexVora Keyboard

        Please provide clear and detailed information so we can fix the issue faster.

        ⚠️ Important:
        - Please report one bug per issue.
        - Do not combine multiple issues in one report.
        - Include clear reproduction steps.

        ## 📌 Before submitting
        Make sure you are using the latest version of NexVora Keyboard.

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Describe step-by-step how to reproduce the issue.
      placeholder: |
        1. Open NexVora Keyboard
        2. Type in any app
        3. Observe the issue
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual Result
      description: What actually happened?
      placeholder: Describe the problem here
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: What should have happened instead?
      placeholder: Describe expected behavior
    validations:
      required: true

  - type: input
    id: keyboard-version
    attributes:
      label: NexVora Keyboard Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "Android 14 / Android 15"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device Model
      placeholder: "Samsung Galaxy S24 / Pixel 8"
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Logs, screenshots, or anything useful
      placeholder: Optional details
    validations:
      required: false
