name: Documentation Issue
description: Report missing, unclear, or incorrect documentation in NexVora Keyboard.
labels: ["documentation"]
title: "Documentation: "

body:
  - type: markdown
    attributes:
      value: |
        # 📘 NexVora Keyboard Documentation Issue

        Thank you for helping improve the documentation.

        ⚠️ Please note:
        - This section is only for documentation improvements or issues.
        - Do not report bugs or feature requests here.
        - Make sure your issue is clear and specific.

  - type: textarea
    id: affected-pages
    attributes:
      label: Affected Pages / Sections
      description: Mention the file, section, or topic where the documentation issue exists.
      placeholder: |
        Example:
        Settings → Keyboard customization section
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What is the issue?
      description: Explain what is wrong, missing, or unclear in the documentation.
      placeholder: |
        Example:
        The instructions for enabling swipe typing are unclear...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested Improvement
      description: Describe how the documentation should be improved or rewritten.
      placeholder: |
        Example:
        Add step-by-step guide with screenshots for swipe typing feature...
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References (Optional)
      description: Link related issues, docs, or examples if available.
      placeholder: |
        - Related issue #12
        - Similar documentation in other keyboards
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        💡 Tip: Clear and simple explanations help us improve documentation faster.
