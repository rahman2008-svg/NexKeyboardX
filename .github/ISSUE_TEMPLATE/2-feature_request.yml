name: Feature Request
description: Suggest a new feature or improvement for NexVora Keyboard.
labels: ["enhancement"]
title: "Feature Request: "

body:
  - type: markdown
    attributes:
      value: |
        # 🚀 Thank you for suggesting a feature for NexVora Keyboard

        We appreciate your ideas to improve the keyboard experience.

        ⚠️ Please note:
        - Submit one feature request per issue.
        - Avoid combining multiple ideas in one request.
        - Make sure you're using the latest version before submitting.

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: |
        Describe the problem or need this feature will solve.
        Focus on the real-world usage, not the solution itself.
        Explain why this feature is useful.
      placeholder: |
        Example:
        I often struggle with fast typing because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Idea
      description: |
        If you have a solution or idea, describe it here.
        You can include UI ideas, behavior examples, or comparisons with other keyboards.
      placeholder: |
        Example:
        The keyboard could include a swipe gesture for...
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References (Optional)
      description: |
        Mention any related issues, apps, or examples.
        You can include screenshots or comparisons if helpful.
      placeholder: |
        - Similar feature in Gboard
        - Related idea #12
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        💡 Tip: Make sure your feature request is clear and focused on a single idea.
