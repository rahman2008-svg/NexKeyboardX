
workflows:
  nexkeyboardx:
    name: NexKeyboard X

    max_build_duration: 120

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - chmod +x gradlew
      - ./gradlew tasks
      - ./gradlew assembleDebug --stacktrace

    artifacts:
      - "**/*.apk"
      - "**/*.aab"